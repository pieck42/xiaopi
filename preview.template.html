<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小皮 · 五种小心情</title>
<style>
:root{color-scheme:dark;--mint:#b4f1cf;--muted:#9aaeb8}
*{box-sizing:border-box}body{margin:0;background:#0c141b;color:#eef4ef;font-family:"Microsoft YaHei",system-ui,sans-serif}
button,input{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #344751;background:#1b2b34;border-radius:14px;padding:12px 18px}
button:hover{background:#2c424c}button:focus-visible,input:focus-visible,.pet-wrap:focus-visible{outline:3px solid var(--mint);outline-offset:4px}
button[aria-pressed=true]{background:var(--mint);border-color:var(--mint);color:#152b21}
header{max-width:1250px;margin:auto;padding:28px 34px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:24px}.brand small{font-size:12px;letter-spacing:3px;color:var(--muted);margin-left:15px}
.tag{font-size:13px;border:1px solid #344751;border-radius:30px;padding:8px 13px;color:#b3c5ca}
main{max-width:1250px;margin:auto;padding:10px 34px 24px;display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
.stage{height:600px;position:relative;overflow:hidden;border:1px solid #2d4148;border-radius:28px;background:radial-gradient(ellipse at 50% 60%,#284342 0%,#14252c 55%,#111d26 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff04 1px,transparent 1px),linear-gradient(90deg,#ffffff04 1px,transparent 1px);background-size:32px 32px}
.stage-label{position:absolute;top:24px;left:24px;color:#a6c3be;font-size:12px;letter-spacing:2px}
.bubble{position:absolute;top:74px;left:8%;width:84%;text-align:center;font-size:22px;line-height:1.7;color:#e1f4e8}
.pet-wrap{position:absolute;left:50%;top:52%;transform:translate(-50%,-40%);touch-action:none;cursor:grab;user-select:none}
.pet-wrap:active{cursor:grabbing}.pet{display:block;width:280px;height:280px;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 14px 14px #0004);transform-origin:50% 95%}
.pet.idle{animation:breathe 3s ease-in-out infinite}.pet.happy{animation:hop .6s ease-in-out infinite}
.status{position:absolute;bottom:61px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:9px;color:var(--mint);font-size:15px}
.dot{width:7px;height:7px;background:var(--mint);border-radius:50%;box-shadow:0 0 16px var(--mint)}
.hint{position:absolute;bottom:25px;width:100%;text-align:center;font-size:12px;color:#91a9b1}
.panel{padding:8px 0}h1{font-size:34px;line-height:1.3;margin:7px 0 14px;letter-spacing:1px}
.intro{color:var(--muted);line-height:1.9;font-size:14px;margin-bottom:21px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--mint)}
.section{border-top:1px solid #263640;padding:19px 0}.section-title{font-size:14px;margin-bottom:13px;color:#b8c9cc}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:12px}.skin{padding:8px;text-align:center}.skin canvas{width:76px;height:76px;image-rendering:pixelated;display:block;margin:0 auto 7px}
.skin strong{display:block;font-size:15px}.skin small{display:block;font-size:11px;opacity:.7;margin-top:4px}
.states{display:flex;flex-wrap:wrap;gap:8px}.states button{font-size:13px;padding:10px 13px;border-radius:10px}
.size-line{display:flex;align-items:center;gap:16px;font-size:13px}.size-line input{flex:1;min-width:80px;accent-color:var(--mint)}
.demo{width:100%;background:var(--mint);color:#14291f;font-weight:700;border:0}.note{color:#8197a1;font-size:12px;line-height:1.8;margin-top:13px}
.reset{position:absolute;right:16px;top:15px;font-size:11px;padding:7px 10px;background:#14232a}
.gallery{max-width:1250px;margin:0 auto;padding:0 34px 35px}.gallery-head{display:flex;align-items:baseline;justify-content:space-between;gap:15px;margin-bottom:18px}
.gallery h2{font-size:20px;margin:0}.gallery-head span{color:var(--muted);font-size:12px}.pose-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.pose{padding:12px 7px 16px;text-align:center;min-width:0;background:#14232b}.pose canvas{display:block;width:100%;max-width:160px;aspect-ratio:1;margin:0 auto 8px;image-rendering:pixelated}
.pose strong{display:block;font-size:15px}.pose small{font-size:11px;opacity:.7;display:block;margin-top:6px;line-height:1.6}
footer{text-align:center;color:#6f8792;font-size:12px;padding:0 16px 25px}
@keyframes breathe{50%{transform:translateY(-3px)}}@keyframes hop{50%{transform:translateY(-14px)}}
@media(max-width:800px){header{padding:22px}.brand small{display:none}main{grid-template-columns:1fr;padding:0 18px 25px;gap:18px}.stage{height:460px}.panel{padding:8px}h1{font-size:30px}.bubble{font-size:18px;top:65px}.tag{font-size:11px}.gallery{padding:0 18px 28px}.pose-grid{grid-template-columns:repeat(2,1fr)}.gallery-head{display:block}.gallery-head span{display:block;margin-top:8px}}
@media(prefers-reduced-motion:reduce){.pet{animation:none!important}}
</style>
</head>
<body>
<header><div class="brand">小皮 <small>A LITTLE COMPANY</small></div><span class="tag">像素伙伴 · 动作原型 02</span></header>
<main>
  <section class="stage" aria-label="小皮互动区域">
    <div class="grid"></div><span class="stage-label">客厅里的小伙伴</span><button class="reset" id="reset">居中</button>
    <div class="bubble" id="bubble" aria-live="polite">正在准备小皮的动作……</div>
    <div class="pet-wrap" id="petWrap" role="button" tabindex="0" aria-label="和小皮打招呼，可拖动换位置">
      <canvas id="pet" class="pet idle" width="420" height="420" role="img" aria-label="小皮，小龙形象"></canvas>
    </div>
    <div class="status"><span class="dot"></span><span id="status">准备中</span></div>
    <div class="hint">拖动换位置 · 点击打招呼 · 按 1–5 切换动作</div>
  </section>
  <aside class="panel">
    <span class="eyebrow">FIVE LITTLE MOODS</span><h1>小皮，今天什么心情？</h1>
    <p class="intro">侧耳听你说，托着腮想一想。<br>每一种状态，都有自己的小动作。</p>
    <div class="section"><div class="section-title">选择形象</div><div class="skins">
      <button class="skin" data-skin="fox" aria-pressed="false"><canvas id="foxThumb" width="160" height="160" aria-hidden="true"></canvas><strong>小狐狸</strong><small>暖橙 · 机灵搭子</small></button>
      <button class="skin" data-skin="dragon" aria-pressed="true"><canvas id="dragonThumb" width="160" height="160" aria-hidden="true"></canvas><strong>小龙</strong><small>薄荷绿 · 元气伙伴</small></button>
    </div></div>
    <div class="section"><div class="section-title">试试五种状态</div><div class="states">
      <button data-state="idle">待机</button><button data-state="listening">倾听</button><button data-state="thinking">思考</button><button data-state="speaking">回答</button><button data-state="happy">开心</button>
    </div></div>
    <div class="section"><div class="size-line"><span>形象大小</span><input id="size" type="range" min="160" max="360" value="280" aria-label="形象大小"><span id="sizeValue">280</span></div></div>
    <button class="demo" id="demo">播放五种动作演示</button>
    <p class="note">每种状态使用两帧独立表情与姿势循环播放。当前对话为预设模拟，没有开启麦克风或连接 Cindy。</p>
  </aside>
</main>
<section class="gallery" aria-label="五种动作对照">
  <div class="gallery-head"><h2>五种动作，一眼看懂</h2><span>点击卡片放大看 · 跟随上方选择的形象</span></div>
  <div class="pose-grid">
    <button class="pose" data-state="idle"><canvas data-pose="idle" width="240" height="240" aria-hidden="true"></canvas><strong>01 待机</strong><small>安静坐好 · 偶尔眨眼</small></button>
    <button class="pose" data-state="listening"><canvas data-pose="listening" width="240" height="240" aria-hidden="true"></canvas><strong>02 倾听</strong><small>爪子靠耳 · 歪头听你</small></button>
    <button class="pose" data-state="thinking"><canvas data-pose="thinking" width="240" height="240" aria-hidden="true"></canvas><strong>03 思考</strong><small>托着下巴 · 抬眼想想</small></button>
    <button class="pose" data-state="speaking"><canvas data-pose="speaking" width="240" height="240" aria-hidden="true"></canvas><strong>04 回答</strong><small>嘴型开合 · 伸爪示意</small></button>
    <button class="pose" data-state="happy"><canvas data-pose="happy" width="240" height="240" aria-hidden="true"></canvas><strong>05 开心</strong><small>眯眼笑 · 挥爪庆祝</small></button>
  </div>
</section>
<footer>小皮 · 在屏幕的一角，也在你的日常里。</footer>
<script>
__ANIMATION_SCRIPT__
</script>
</body>
</html>
